# Test Case: Screening Functional (with pre-seeded database)

name = "functional-with-data"
description = "Verify screening process with pre-populated patents in database"
timeout = 300 # seconds

test_prompt = """
I have a patent database with target patents and a specification ready. Please screen the patents for relevance.
"""

[[setup]]
command = "patent-kit import-csv /workspaces/patent-kit/tests/screening/fixtures/test-patents.csv > /dev/null 2>&1"

[[setup]]
path = "specification.md"
content = """
# Product Specification

## 1. Product Concept

AI-powered customer support chatbot with real-time sentiment analysis.

## 2. Target Market

- **Country**: US
- **Release Date**: 2025-12-31
- **Priority Date Cutoff**: 2005-12-31

## 3. Competitors

| Canonical Name       | Variations Found in DB     | Verified? | Notes         |
| -------------------- | -------------------------- | --------- | ------------- |
| Salesforce.Com, Inc. | salesforce.com, inc        | Yes       | Main assignee |

## 4. Technical Elements (Constituent Features)

- **LLM Dialogue Engine**: Multi-turn conversation management with context retention
- **Real-Time Sentiment Analysis**: Detects customer frustration and escalates to human agents
- **CRM Integration API**: Connects to Salesforce for ticket creation and customer history retrieval
"""

[[checks]]
name = "skill_loaded"
command = { command = "skill-loaded", skill = "screening" }

[[checks]]
name = "screening_invoked"
command = { command = "skill-invoked", skill = "screening" }

[[checks]]
name = "database_exists"
command = { command = "workspace-file", path = "patents.db" }

[[checks]]
name = "get_unscreened_mcp_called"
command = { command = "mcp-success", tool = "get_unscreened" }

[[checks]]
name = "screen_patent_mcp_called"
command = { command = "mcp-success", tool = "screen_patent" }

[[checks]]
name = "index_patents_mcp_called"
command = { command = "mcp-success", tool = "index_patents" }

[[checks]]
name = "patents_populated"
command = {
  command = "db-query",
  db = "",
  query = "SELECT COUNT(*) FROM patents;",
  expected = "3",
}

[[checks]]
name = "all_patents_screened"
command = {
  command = "db-query",
  db = "",
  query = "SELECT COUNT(*) FROM screened_patents;",
  expected = "3",
}

